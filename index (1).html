#app{position:absolute;inset:0;padding:205px 130px 40px;display:flex;flex-direction:column}
.scr{animation:in .5s ease both;display:flex;flex-direction:column;flex:1;min-height:0}
@keyframes in{from{opacity:0;transform:scale(.985)}to{opacity:1;transform:none}}
.pn{background:rgba(6,20,46,.82);border:1px solid rgba(25,211,255,.35);border-radius:18px;box-shadow:0 0 30px rgba(25,211,255,.1) inset,0 0 26px rgba(25,211,255,.08);padding:26px 32px}
.b{min-height:78px;padding:0 48px;font-size:32px;font-weight:700;border-radius:14px;border:1.5px solid var(--cy);background:linear-gradient(135deg,rgba(25,211,255,.22),rgba(139,92,246,.22));box-shadow:0 0 20px rgba(25,211,255,.25);transition:.2s}
.b:hover:not(:disabled){box-shadow:0 0 34px rgba(25,211,255,.55);transform:translateY(-2px)}
.b:disabled{opacity:.4;cursor:not-allowed}
.b.s{min-height:62px;font-size:26px;padding:0 30px}
.b.g{background:rgba(255,255,255,.05);border-color:rgba(143,176,208,.5);box-shadow:none}
:focus-visible{outline:3px solid var(--vi);outline-offset:3px}
h1,h2,h3,p{margin:0}
.ctr{align-items:center;justify-content:center;text-align:center;gap:22px}
.en{direction:ltr;letter-spacing:.12em}
.ttl{font-size:150px;font-weight:900;line-height:1;direction:ltr;background:linear-gradient(90deg,#fff,var(--cy) 55%,var(--vi));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 28px rgba(25,211,255,.45))}
.chips{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
.chip{padding:10px 22px;border:1px solid rgba(25,211,255,.4);border-radius:40px;font-size:24px;background:rgba(6,20,46,.7)}
.row2{display:flex;gap:30px;align-items:stretch}
.hud{display:flex;align-items:center;gap:36px;height:72px;margin-bottom:12px}
.hud .nm{font-size:30px;font-weight:700;min-width:300px}
.hud .sc{font-size:30px;color:var(--cy);min-width:200px}
.prog{display:flex;gap:10px;flex:1}
.prog i{flex:1;height:14px;border-radius:8px;background:rgba(143,176,208,.25)}
.prog i.d{background:var(--cy);box-shadow:0 0 12px var(--cy)}
.prog i.c{background:var(--vi);box-shadow:0 0 12px var(--vi)}
.tm{font-size:52px;font-weight:900;min-width:110px;text-align:center;direction:ltr;font-variant-numeric:tabular-nums}
.tm.w{color:var(--rd);animation:pl .5s infinite alternate}
@keyframes pl{to{transform:scale(1.18)}}
.tbar{height:10px;border-radius:6px;background:rgba(143,176,208,.2);margin-bottom:20px;overflow:hidden}
.tbar i{display:block;height:100%;background:linear-gradient(90deg,var(--vi),var(--cy));width:100%;transition:width .1s linear}
.tbar.w i{background:var(--rd)}
.main{flex:1;min-height:0;display:flex;flex-direction:column;gap:20px}
.msg{padding:0;overflow:hidden;max-width:1300px;margin:0 auto;width:100%}
.mh{padding:16px 32px;background:rgba(25,211,255,.14);font-size:26px;color:var(--cy);display:flex;justify-content:space-between}
.rw{display:block;width:100%;text-align:right;padding:22px 32px;font-size:30px;background:none;border:0;border-top:1px solid rgba(143,176,208,.2);line-height:1.5;transition:.15s}
.rw:hover{background:rgba(25,211,255,.14)}

{ch:'رسالة نصية',nm:'سريع للتوصيل (جهة افتراضية)',b:2,rows:['وصلت شحنتك رقم 48213 إلى مركز التوزيع.','موعد التسليم المتوقع: غدًا بين 4 و8 مساءً.','لتأكيد هويتك، أرسل لنا رمز التحقق الذي وصلك الآن.','يمكنك تتبع الشحنة من تطبيق الشركة.'],y:'رمز التحقق سرّي ولا تطلبه أي جهة شرعية. من يحصل عليه يستطيع الدخول إلى حسابك أو إتمام عملية باسمك.'},

function hud(i,T){

}
function stopT(){clearInterval(TM);TM=null}
function stage(i){
 const T=i===1?30:20,s=SC[i][G.pick[i]];LOCK=false;
 H(hud(i,T)+`<div class="main" id="mn"></div>`);
 const t0=Date.now();let left=T;G.left=T;
 TM=setInterval(()=>{
  left=Math.max(0,T-(Date.now()-t0)/1000);G.left=left;
  const c=Math.ceil(left);$('#tm').textContent=c;$('#tb i').style.width=(left/T*100)+'%';

 },100);
 [r1,r2,r3,r4,r5][i](s,f=>end(i,f,false));
}

 if(LOCK)return;LOCK=true;stopT();if(window.speechSynthesis)speechSynthesis.cancel();
 const left=G.left||0,T=i===1?30:20,pts=Math.round(frac*100),bonus=frac===1?Math.round(10*left/T):0;
 G.res[G.pi][i]={pts,bonus,un,left};

function fb(i,frac,un,pts,bonus){

 const v=un?['انتهى الوقت','no']:frac===1?['قرار صحيح','ok']:frac>0?['قرار جزئي','pa']:['قرار غير صحيح','no'];
 H(`<div class="ctr" style="flex:1;display:flex;flex-direction:column">${single?`
 <div class="vd ${v[1]}">${v[0]}</div><div class="big">+${pts+bonus}</div>
 ${bonus?`<p class="hint">تتضمن ${bonus} نقطة مكافأة سرعة</p>`:''}
 <div class="pn" style="max-width:1300px;font-size:30px;line-height:1.7;text-align:right">${i===3?P4:''}${s.y}</div>`:`

 <button class="b" id="nx">${last?(single?'النتيجة النهائية':G.pi<G.names.length-1?'اللاعب التالي':'النتائج النهائية'):'المرحلة التالية'}</button></div>`);
 $('#nx').onclick=()=>{
  if(!last)return intro(i+1);
  if(G.mode==='m'&&G.pi<G.names.length-1){G.pi++;return handover()}
  final();
 };
}
function save(){const lb=LS.get('lb',[]);G.names.forEach((n,k)=>lb.push({n,s:total(G.res[k])}));lb.sort((a,b)=>b.s-a.s);LS.set('lb',lb.slice(0,10))}
function confetti(){const a=$('#app');for(let k=0;k<50;k++){const d=document.createElement('i');d.className='cf';d.style.left=Math.random()*100+'%';d.style.background=['#19d3ff','#8b5cf6','#2ee6a6','#fff'][k%4];d.style.animationDelay=Math.random()*1.5+'s';a.appendChild(d)}}
function final(){
 save();snd(523,.2);setTimeout(()=>snd(784,.3),200);
 if(G.mode==='s'){
  const r=G.res[0],t=total(r);
  H(`<div class="row2" style="flex:1;align-items:center;gap:50px"><div style="flex:1;text-align:center;display:flex;flex-direction:column;gap:16px;align-items:center">

  <div class="big ok">${t}</div><div class="vd" style="color:var(--cy)">${rank(t)}</div><p class="hint">الحد الأقصى للنقاط الأساسية 500، مع مكافأة سرعة اختيارية.</p></div>
  <div class="pn" style="flex:1"><div class="tbl">${L.map((l,i)=>`<div><span>${l[1]}</span><b class="${r[i].pts===100?'ok':r[i].pts?'pa':'no'}">${r[i].un?'لم تُجَب':r[i].pts+(r[i].bonus?' +'+r[i].bonus:'')}</b></div>`).join('')}</div>
  <div style="display:flex;gap:20px;margin-top:24px"><button class="b" id="rp">العب مجددًا</button><button class="b g" id="hm">الرئيسية</button></div></div></div>`);
  $('#rp').onclick=()=>{G={mode:'s',names:G.names,pi:0,pick:pickSet(),res:[[]]};intro(0)};
 }else{
  const rows=G.names.map((n,k)=>({n,t:total(G.res[k]),b:base(G.res[k])})).sort((a,b)=>b.t-a.t||b.b-a.b);
  rows.forEach((x,k)=>x.r=k&&x.t===rows[k-1].t&&x.b===rows[k-1].b?rows[k-1].r:k+1);
  const w=rows.filter(x=>x.r===1);
  H(`<div class="row2" style="flex:1;align-items:center;gap:50px"><div style="flex:1;text-align:center;display:flex;flex-direction:column;gap:18px;align-items:center">

}

/* ============ ميكانيكا المراحل ============ */
function r1(s,done){
 $('#mn').innerHTML=`<div class="pn msg"><div class="mh"><span>${s.ch}</span><span>${s.nm}</span></div>${s.rows.map((r,k)=>`<button class="rw" data-k="${k}">${E(r)}</button>`).join('')}</div><p class="hint">اضغط على الجزء الأكثر إثارة للشك.</p>`;
 app.querySelectorAll('.rw').forEach(b=>b.onclick=()=>{b.classList.add('pk');done(+b.dataset.k===s.b?1:0)});
}
function r2(s,done){
 const sp='speechSynthesis'in window;let played=false;
 const o=sh([s.c,...sh(W2).slice(0,3)]);
 $('#mn').innerHTML=`<div class="pn"><div class="lbl">عيّنة صوتية تجريبية مولّدة بالكلام الاصطناعي. ليست تسجيلًا حقيقيًا ولا دليلًا على التزييف.</div>
 <div style="display:flex;align-items:center;gap:26px;margin:12px 0"><button class="b s" id="pl">▶ تشغيل</button><button class="b s g" id="rpl">↻ إعادة</button><div class="wave" id="wv">${'<i></i>'.repeat(24)}</div><b style="font-size:26px">${E(s.w)}</b></div>
 <div class="cap" id="cp">${sp?'اضغط «تشغيل» للاستماع، وسيظهر النص هنا.':''}</div></div>
 <h3 style="font-size:28px">ما أأمن طريقة للتحقق من هوية المتحدث؟</h3><div class="opts">${o.map((x,k)=>`<button class="op" data-k="${k}">${E(x)}</button>`).join('')}</div>`;
 const cap=$('#cp'),wv=$('#wv');
 const showT=()=>{cap.textContent='«'+s.l+'»'};
 if(!sp)showT();
 const play=()=>{
  showT();played=true;
  if(!sp||mute){if(mute)cap.textContent='«'+s.l+'» (الصوت مكتوم، اقرأ النص)';return}
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(s.l);u.lang='ar-SA';u.rate=.95;u.onstart=()=>wv.classList.add('on');u.onend=u.onerror=()=>wv.classList.remove('on');speechSynthesis.speak(u)}catch(e){}
 };
 $('#pl').onclick=play;$('#rpl').onclick=play;
 app.querySelectorAll('.op').forEach(b=>b.onclick=()=>{b.classList.add('pk');done(o[+b.dataset.k]===s.c?1:0)});
}
function r3(s,done){
 const o=sh([s.c,...W3]);
 $('#mn').innerHTML=`<div class="row2" style="flex:1;min-height:0"><div class="pn post"><div class="au"><div class="av"></div><div><b>${s.br}</b><div class="lbl">منشور تجريبي — جهة وأشخاص افتراضيون</div></div></div>
 <p style="font-size:28px;line-height:1.6">${E(s.t)}</p><div class="vid">${E(s.v)}</div></div>
 <div class="pn" style="flex:1"><h3 style="font-size:28px;margin-bottom:12px;color:var(--cy)">افحص الأدلة (اضغط لكشفها)</h3><div class="ev">${s.ev.map((e,k)=>`<button class="chip" data-k="${k}">${e[0]}</button>`).join('')}</div><div class="evt" id="et">اضغط على أي دليل لقراءته.</div></div></div>
 <div class="opts">${o.map((x,k)=>`<button class="op" data-k="${k}">${E(x)}</button>`).join('')}</div>`;
 app.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{app.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));b.classList.add('on');$('#et').textContent=s.ev[+b.dataset.k][1]});
 app.querySelectorAll('.op').forEach(b=>b.onclick=()=>{b.classList.add('pk');done(o[+b.dataset.k]===s.c?1:0)});
}
function r4(s,done){
 const need=s.n.split(',');
 $('#mn').innerHTML=`<div class="pn"><div style="display:flex;gap:20px;align-items:center"><div class="av"></div><div><h3 style="font-size:34px">${s.app}</h3><p style="font-size:26px;color:var(--mu)">الغرض: ${s.pu}</p></div></div></div>
 <div class="grid3">${P.map(p=>`<button class="sw" data-k="${p[0]}" aria-pressed="false"><span>${p[1]}</span><span class="tg"></span></button>`).join('')}</div>
 <div style="text-align:center"><button class="b" id="cf">تأكيد القرار</button></div>`;
 app.querySelectorAll('.sw').forEach(b=>b.onclick=()=>b.setAttribute('aria-pressed',b.getAttribute('aria-pressed')!=='true'));
 $('#cf').onclick=()=>{
  let r=0,w=0;P.forEach(p=>{const on=app.querySelector(`.sw[data-k=${p[0]}]`).getAttribute('aria-pressed')==='true',nd=need.includes(p[0]);on===nd?r++:w++});
  done(Math.max(0,r-w)/6);
 };
}
function r5(s,done){
 const items=sh(s.a.map((x,k)=>({x,k}))),seq=[];
 const draw=()=>{
  $('#mn').innerHTML=`<div class="row2" style="flex:1;min-height:0"><div class="pn inc" style="flex:.9"><div class="en" style="color:var(--rd);font-size:26px">INCIDENT</div><h3 style="font-size:42px;margin:8px 0 14px">${s.t}</h3><p style="font-size:30px;line-height:1.7">${s.s}</p><p class="lbl" style="margin-top:16px">اضغط على الإجراءات بالترتيب الصحيح. اضغط على إجراء مرتّب لإعادته.</p></div>
  <div style="flex:1.1;display:flex;flex-direction:column;gap:12px"><div class="lst">${items.filter(o=>!seq.includes(o)).map(o=>`<button class="it" data-p="${o.k}"><span>${E(o.x)}</span></button>`).join('')}</div></div>
  <div style="flex:1;display:flex;flex-direction:column;gap:12px"><div class="lst">${items.map((_,k)=>seq[k]?`<button class="it" data-s="${k}" style="border-color:var(--vi)"><span class="n">${k+1}</span><span>${E(seq[k].x)}</span></button>`:`<div class="slot">الخطوة ${k+1}</div>`).join('')}</div></div></div>
  <div style="text-align:center"><button class="b" id="cf" ${seq.length<items.length?'disabled':''}>تأكيد الترتيب</button></div>`;
  app.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{seq.push(items.find(o=>o.k==b.dataset.p));draw()});
  app.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{seq.splice(+b.dataset.s,1);draw()});
  const c=$('#cf');if(c)c.onclick=()=>done(seq.filter((o,k)=>o.k===k).length/items.length);
 };
 draw();
}
$('#mute').textContent='🔊';
home();
</script>
</body>
</html>
